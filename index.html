<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Xenial SMS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ff6b2c'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white'>✉</text></svg>">
  <style>
    html, body { margin: 0; height: 100%; background: #f3f5f9; overflow: hidden; }
    @media (prefers-color-scheme: dark) { html, body { background: #0f141b; } }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #fallback { display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
      font: 15px system-ui, sans-serif; color: #6b7686; text-align: center; padding: 16px; }
    #fallback a { color: #ff6b2c; }
  </style>
</head>
<body>
  <!-- Paste your Apps Script Web App URL (ends with /exec) below -->
  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbweafWzIN0xuPrsqUGgrHGPkN-nQ0DEaw8jJKh3H0RKAQFIsI2JN7cy1OnC4nvaYA/exec"
    title="Xenial SMS"></iframe>

  <div id="fallback">
    <p>Couldn't load the app here.<br><a id="direct" href="#" target="_top">Open Xenial SMS directly</a></p>
  </div>

  <script>
    var frame = document.getElementById('app');
    document.getElementById('direct').href = frame.src;
    // If the URL wasn't filled in, show the fallback instead of a blank page.
    if (frame.src.indexOf('PASTE_YOUR') !== -1) {
      frame.style.display = 'none';
      document.getElementById('fallback').style.display = 'flex';
    }
  </script>
</body>
</html>
